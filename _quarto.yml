project:
  type: website
  execute-dir: project
  output-dir: docs
  render: 
    - "*.qmd"

website:
  title: "R Programming for Biologists"
  favicon: materials/images/logo_lyon.png
  repo-url: https://github.com/njlyon0/teach_r-for-bio
  repo-actions: [issue]
  navbar:
    right:
      - text: "Alumni"
        href: alumni.qmd
      - text: "Instructors"
        menu:
          - text: "Nick J Lyon"
            href: https://njlyon0.github.io/
      - icon: github
        href: https://github.com/njlyon0/teach_r-for-bio
        aria-label: GitHub
  sidebar:
    style: "docked"
    alignment: left
    border: true
    collapse-level: 2
    contents:
      - section: "Course Overview"
        contents:
          - text: "Home"
            href: index.qmd
          - text: "Schedule"
            href: syllabus/schedule.qmd
          - text: "Assignments"
            href: syllabus/assignments.qmd
          - text: "Policies"
            href: syllabus/policies.qmd
          - text: "Example Data"
            href: data.qmd
          - text: "Readings"
            href: readings.qmd
          - text: "Answer Keys"
            href: keys.qmd
      - section: "Assignment Rubrics"
        contents:
          - text: "Muddiest Point"
            href: rubrics/rubric_muddiest-point.qmd
          - text: "Homework"
            href: rubrics/rubric_homework.qmd
          - text: "GitHub Presence"
            href: rubrics/rubric_github.qmd
          - text: "Function Tutorials"
            href: rubrics/rubric_tutorials.qmd
      - section: "Course Content"
        contents:
          - text: "1. Fundamentals"
            href: materials/home_week1.qmd
          - text: "2. Packages, Data, & Version Control"
            href: materials/home_week2.qmd
          - text: "3. Data Wrangling"
            href: materials/home_week3.qmd
          - text: "4. Joins & Stats I"
            href: materials/home_week4.qmd
          - text: "5. Stats II & V1 Presentations"
            href: materials/home_week5.qmd
          - text: "6. Data Visualization"
            href: materials/home_week6.qmd
          - text: "7. Loops & V2 Presentations"
            href: materials/home_week7.qmd
          - text: "8. Custom Functions & Bonus Topic"
            href: materials/home_week8.qmd
      - section: "Continuing Education"
        contents:
          - text: "Additional Resources"
            href: resources.qmd
  page-footer:
    center: "&copy; 2026, Nicholas J Lyon"

execute:
  freeze: auto

format:
  html:
    code-overflow: wrap
    code-line-numbers: false
    code-copy: hover
    theme:
      light: _extensions/njlyon0/lyon_theme/lyon_light.scss
      dark: _extensions/njlyon0/lyon_theme/lyon_dark.scss
    mainfont: Open Sans
    toc: true
    link-external-newwindow: true
    link-external-icon: false
